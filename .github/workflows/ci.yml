name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 é o mínimo do kit; "3.x" é a versão estável mais nova que o setup-python oferece.
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar as ferramentas de verificação
        run: python -m pip install ruff shellcheck-py vermin pytest
      - name: ruff
        run: ruff check .
      - name: shellcheck
        run: shellcheck bin/* install.sh
      - name: vermin (compatível com Python 3.9)
        run: vermin --target=3.9- --no-tips --violations skills tools tests
      - name: Arquivos gerados em dia
        run: python tools/gerar.py --conferir
      - name: Varredura de segredos e dados pessoais
        run: python tools/varredura.py
      - name: pytest
        run: python -m pytest
